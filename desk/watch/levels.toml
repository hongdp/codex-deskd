# Price levels the watch service guards. Paper desk: a breach WAKES the trader
# thread with a structured message; the trader answers with a proposal only.
#
# side = "below" fires when last price < price; "above" when last price > price.
# The dedup key carries the distance past the level in 1% steps (parlay's
# sentinel cadence): a name resting on its line speaks once, a deepening
# breach speaks again each further 1%.

