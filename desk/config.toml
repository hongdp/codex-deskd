# codex-deskd — desk-wide config (CODEX_HOME = this directory).
# Roles live in agents/*.toml and layer on top of this file.
model = "gpt-5.5"
model_reasoning_effort = "medium"
approval_policy = "never"          # headless desk: no human approval prompts
approvals_reviewer = "auto_review" # escalated approvals go to the Guardian reviewer
sandbox_mode = "workspace-write"
mcp_oauth_credentials_store = "file"  # headless host: CODEX_HOME/.credentials.json (no keyring)

[sandbox_workspace_write]
network_access = true

[auto_review]
policy = """
You review tool calls for a paper-first stock trading desk.
Block any brokerage WRITE (placing, previewing-for-placement, or cancelling
orders) unless the calling agent's role is `trader` AND the call cites a
per-order review note. Block edits to the desk contract (AGENTS.md, rules/,
hooks/, config.toml, agents/). Allow research, reads, and journaling.
"""

[mcp_servers.robinhood-trading]
url = "https://agent.robinhood.com/mcp/trading"
enabled = false   # roles opt in; login once with: codex-desk mcp login robinhood-trading

[features]
multi_agent_v2 = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.5"

[agents.analyst]
description = "Research seat: market/sector/company research, factor validation, dossiers. Proposes and vetoes; never executes."
config_file = "./agents/analyst.toml"
nickname_candidates = ["Ada", "Hypatia"]

[agents.trader]
description = "Execution seat: reviews every proposed order, submits only after per-order review, reconciles fills."
config_file = "./agents/trader.toml"
nickname_candidates = ["Rook", "Tessa"]

[agents.engineer]
description = "Implementation seat: code, tests, tooling, runtime config. No trading, broker, or order surface."
config_file = "./agents/engineer.toml"
nickname_candidates = ["Grace", "Linus"]

[projects."/home/hongdp/Workspace/codex-deskd"]
trust_level = "trusted"

[projects."/tmp/claude-1000/-home-hongdp-Workspace-parlay/075569ff-73b4-4765-bebb-9d429d13e66d/scratchpad/wd"]
trust_level = "trusted"

[hooks.state."/home/hongdp/Workspace/codex-deskd/desk/hooks.json:pre_tool_use:0:0"]
trusted_hash = "sha256:2340746619d7ca7aad00fe88f4d073e430a07c431bd8875ed41db2a32f7a3893"
enabled = true

# Local wire adapter (desk/shim/responses_gemini.py) — Gemini behind the Responses API.
# Start it first:  python3 desk/shim/responses_gemini.py --port 8397
# Use per role:    model_provider = "gemini"  +  model = "gemini-3.1-pro-preview"
[model_providers.gemini]
name = "Gemini via local shim"
base_url = "http://127.0.0.1:8397/v1"
wire_api = "responses"
request_max_retries = 2
stream_max_retries = 2
